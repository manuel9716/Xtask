apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: xtask-ingress
  namespace: xtask-platform
  annotations:
    nginx.ingress.kubernetes.io/rewrite-target: /
    nginx.ingress.kubernetes.io/ssl-redirect: "true"
    cert-manager.io/cluster-issuer: "letsencrypt-prod"
spec:
  ingressClassName: nginx
  tls:
  - hosts:
    - xtask.yourdomain.com
    secretName: xtask-tls
  rules:
  - host: xtask.yourdomain.com
    http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: xtask-service
            port:
              number: 80