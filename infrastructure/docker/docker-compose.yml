version: '3.8'

services:
  # PostgreSQL Database
  postgres:
    image: postgres:15-alpine
    container_name: xtaskflow-postgres
    environment:
      POSTGRES_DB: xtaskflow_db
      POSTGRES_USER: xtaskflow_user
      POSTGRES_PASSWORD: XtaskFlow2024!
      PGDATA: /var/lib/postgresql/data/pgdata
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./server/infrastructure/database/init:/docker-entrypoint-initdb.d
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U xtaskflow_user -d xtaskflow_db"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - xtaskflow-network
    restart: unless-stopped

  # SQL Server 2019 (Opcional - para compatibilidad futura)
  sqlserver:
    image: mcr.microsoft.com/mssql/server:2019-latest
    container_name: xtaskflow-sqlserver
    environment:
      ACCEPT_EULA: "Y"
      SA_PASSWORD: "XtaskFlow2024!"
      MSSQL_PID: "Developer"
      MSSQL_TCP_PORT: 1433
    ports:
      - "1433:1433"
    volumes:
      - sqlserver_data:/var/opt/mssql
    healthcheck:
      test: /opt/mssql-tools/bin/sqlcmd -S localhost -U sa -P "XtaskFlow2024!" -Q "SELECT 1" || exit 1
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    networks:
      - xtaskflow-network
    restart: unless-stopped
    profiles:
      - sqlserver  # Solo se inicia si se especifica el perfil

  # pgAdmin - Interfaz web para PostgreSQL
  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: xtaskflow-pgadmin
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@xtaskflow.com
      PGADMIN_DEFAULT_PASSWORD: admin
      PGADMIN_CONFIG_SERVER_MODE: 'False'
    ports:
      - "5050:80"
    volumes:
      - pgadmin_data:/var/lib/pgadmin
    networks:
      - xtaskflow-network
    depends_on:
      - postgres
    restart: unless-stopped

  # Adminer - Interfaz web ligera para múltiples bases de datos
  adminer:
    image: adminer:latest
    container_name: xtaskflow-adminer
    ports:
      - "8081:8080"
    environment:
      ADMINER_DEFAULT_SERVER: postgres
      ADMINER_DESIGN: nette
    networks:
      - xtaskflow-network
    depends_on:
      - postgres
    restart: unless-stopped

volumes:
  postgres_data:
    driver: local
  sqlserver_data:
    driver: local
  pgadmin_data:
    driver: local

networks:
  xtaskflow-network:
    driver: bridge
