apiVersion: v1
kind: Secret
metadata:
  name: xtask-secrets
  namespace: xtask-platform
type: Opaque
data:
  # Secrets encoded in base64
  # DATABASE_URL: <base64-encoded-database-url>
  # STRIPE_SECRET_KEY: <base64-encoded-stripe-key>
  # VITE_STRIPE_PUBLIC_KEY: <base64-encoded-stripe-public-key>
  # PGUSER: <base64-encoded-pg-user>
  # PGPASSWORD: <base64-encoded-pg-password>
  # PGHOST: <base64-encoded-pg-host>
  # PGPORT: <base64-encoded-pg-port>
  # PGDATABASE: <base64-encoded-pg-database>
stringData:
  # Use stringData for plain text secrets (Kubernetes will encode them)
  DATABASE_URL: "postgresql://user:password@postgres:5432/xtask"
  SESSION_SECRET: "your-session-secret-here"