apiVersion: v1
kind: ServiceMonitor
metadata:
  name: xtask-monitoring
  namespace: xtask-platform
  labels:
    app: xtask-app
spec:
  selector:
    matchLabels:
      app: xtask-app
  endpoints:
  - port: http
    path: /api/health
    interval: 30s
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: grafana-dashboard
  namespace: xtask-platform
data:
  xtask-dashboard.json: |
    {
      "dashboard": {
        "title": "XTask Platform Monitoring",
        "panels": [
          {
            "title": "Pod Status",
            "type": "stat",
            "targets": [
              {
                "expr": "up{job=\"xtask-app\"}"
              }
            ]
          },
          {
            "title": "Response Time",
            "type": "graph",
            "targets": [
              {
                "expr": "histogram_quantile(0.95, rate(http_request_duration_seconds_bucket[5m]))"
              }
            ]
          },
          {
            "title": "Memory Usage",
            "type": "graph",
            "targets": [
              {
                "expr": "container_memory_usage_bytes{pod=~\"xtask-app-.*\"}"
              }
            ]
          }
        ]
      }
    }